[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-dual-arm-teaching"
version = "0.1.0"
description = "Unitree G1 high precision dual arm joint waypoint teaching"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]
fk = ["ikpy>=4.0"]
fk-mujoco = ["mujoco>=3.1"]
fk-pinocchio = ["pin>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
